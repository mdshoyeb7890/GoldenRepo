spring:
  application:
    name: FirstDemo

  transaction:
    default-timeout: 60

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 60000
      idle-timeout: 300000
      max-lifetime: 1800000
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          batch_size: 20
          order_inserts: true
          generate_statistics: false
        format_sql: true

server:
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
